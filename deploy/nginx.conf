# Nginx du projet Nissali (conteneur, port 33000).
# Il reçoit le trafic du nginx du VPS — qui termine le TLS — et le répartit
# entre le web (back-office + espace pro) et l'API. Ce conteneur ne fait que du HTTP.
#
# Côté VPS, le proxy DOIT transmettre le domaine d'origine, sinon le routage
# retombe sur le site web :
#     proxy_set_header Host $host;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;

# Le TLS est terminé par le VPS : on reprend son en-tête, https par défaut.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen 33000;
    server_name www.nissali.fr;
    return 301 https://nissali.fr$request_uri;
}

# Serveur par défaut : un Host non reconnu tombe sur le site web plutôt que sur une erreur.
server {
    listen 33000 default_server;
    server_name nissali.fr _;

    # Documents des fiches clientes (10 Mo maximum côté API).
    client_max_body_size 12m;

    location / {
        proxy_pass http://web:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

server {
    listen 33000;
    server_name api.nissali.fr;

    client_max_body_size 12m;

    location / {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
